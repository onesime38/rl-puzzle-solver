<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Application pédagogique : des agents d'apprentissage par renforcement (Q-learning, Double Q-learning, processus de décision markovien) apprennent à résoudre un Rubik's Cube 3x3x3 et un Megaminx (dodécaèdre)."
    />
    <title>RL Puzzle Solver — Q-learning, Double Q-learning, MDP</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("rl-puzzle-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
